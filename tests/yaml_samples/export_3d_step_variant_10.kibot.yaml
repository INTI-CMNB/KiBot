# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/INTI-CMNB/KiBot@master/docs/kibot_schema.json
# Example KiBot config file
kibot:
  version: 1

variants:
  - name: 'V1'
    comment: 'Test 1 Variant V1'
    type: kicad
    file_id: '_(V1)'

  - name: 'V2'
    comment: 'Test 1 Variant V2'
    type: kicad
    file_id: '_(V2)'

  - name: 'V3'
    comment: 'Test 1 Variant V3'
    type: kicad
    file_id: '_V3'

outputs:
  - name: 'step'
    comment: "3D model"
    type: export_3d
    dir: Step
    options:
      variant: 'Default'

  - name: 'step_v1'
    comment: "3D model for variant V1"
    type: export_3d
    dir: Step
    options:
      variant: V1

  - name: 'step_v2'
    comment: "3D model for variant V2"
    type: export_3d
    dir: Step
    options:
      variant: V2

  - name: 'step_v3'
    comment: "3D model for variant V3"
    type: export_3d
    dir: Step
    options:
      variant: V3
