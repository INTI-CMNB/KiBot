# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/INTI-CMNB/KiBot@master/docs/kibot_schema.json
# Test case for a sheet marked as DNP the test project is tests/board_samples/kicad_*/sheet_flags/repro.kicad_sch
# We also test the save of this schematic using the "copy_files" so it should save something equivalent to the original
kibot:
  version: 1

filters:
  - name: kicad_dnp
    type: generic
    exclude_kicad_dnp: true

outputs:
  - name: bom
    type: bom
    comment: "BoM for R3 and R4, not others"
    options:
      format: CSV
      csv:
        hide_pcb_info: true
        hide_stats_info: true

  - name: position
    type: position
    comment: "P&P for R3 and R4, not others"
    options:
      format: CSV
      separate_files_for_front_and_back: false
      exclude_filter: kicad_dnp

  - name: schematic
    type: copy_files
    dir: copy
    comment: "Copy the project"
    options:
      files:
        - source_type: project
          dest: prj
