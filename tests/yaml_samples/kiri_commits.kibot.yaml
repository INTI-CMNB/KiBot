# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/INTI-CMNB/KiBot@master/docs/kibot_schema.json
kibot:
  version: 1

outputs:
  - name: 'kiri'
    comment: "Test for KiRi explicit commits"
    type: kiri
    layers: ['F.Cu', 'In1.Cu', 'F.SilkS']
    options:
      commits:
        - v1
        - HEAD
      labels:
        - 'Release v1'
        - 'Release v2'
