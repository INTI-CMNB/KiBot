# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/INTI-CMNB/KiBot@master/docs/kibot_schema.json
kiplot:
  version: 1

outputs:
  - name: PcbDraw
    comment: "PcbDraw test top"
    type: pcbdraw
    dir: PcbDraw
    options:
      format: svg
      style: bogus
      no_drillholes: True
      placeholder: True
      mirror: True
      vcuts: True
      warnings: all
