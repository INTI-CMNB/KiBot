# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/INTI-CMNB/KiBot@master/docs/kibot_schema.json
kibot:
  version: 1

preflight:
  annotate_pcb:
    top_main_axis: x
    top_main_ascending: true
    top_secondary_ascending: true
    bottom_main_axis: x
    bottom_main_ascending: true
    bottom_secondary_ascending: true
    use_position_of: reference
    grid: 1.0
