# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/INTI-CMNB/KiBot@master/docs/kibot_schema.json
# Example KiBot config file
kibot:
  version: 1

globals:
  field_part_number: MPN

outputs:
  - name: 'Board View Test'
    comment: "Example of board view export"
    type: boardview
    options:
      exclude_filter: _mechanical
      format: OBDATA
