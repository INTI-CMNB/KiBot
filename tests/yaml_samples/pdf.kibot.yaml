kiplot:
  version: 1

outputs:
  - name: PDF
    comment: "PDF files"
    type: pdf
    dir: PDF
    options:
      exclude_edge_layer: false
      plot_sheet_reference: false
      plot_footprint_refs: true
      plot_footprint_values: true
      force_plot_invisible_refs_vals: false
      tent_vias: true

      # PDF options
      drill_marks: small
      mirror_plot: false
      negative_plot: false
    layers:
      - layer: F.Cu
        suffix: F_Cu
      - layer: B.SilkS
        suffix: B_Silks
