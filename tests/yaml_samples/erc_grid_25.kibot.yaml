# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/INTI-CMNB/KiBot@master/docs/kibot_schema.json
# Example KiBot config file
kibot:
  version: 1

global:
  erc_grid: 25

preflight:
  run_erc: true
  erc_warnings: true
  filters:
    - filter: 'Ignore KiCad 6 lib_symbol_issues'
      error: lib_symbol_issues
      regex: ''
