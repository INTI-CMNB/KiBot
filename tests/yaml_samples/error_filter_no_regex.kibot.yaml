# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/INTI-CMNB/KiBot@master/docs/kibot_schema.json
# Example KiBot config file
kibot:
  version: 1

preflight:
  run_drc: true
  filters:
    - filter: 'Ignore C3 pad 2 too close to anything'
      number: 2
      regex:
    - filter: 'Ignore unconnected pad 2 of C4'
      number: 2
      regex:  'Pad 2 of C4'


