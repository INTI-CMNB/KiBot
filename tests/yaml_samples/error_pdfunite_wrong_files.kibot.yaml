# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/INTI-CMNB/KiBot@master/docs/kibot_schema.json
kiplot:
  version: 1

outputs:
  - name: PDF_Joined
    comment: "PDF files for top layer + mirrored bottom layer"
    type: pdfunite
    options:
      use_external_command: false
      outputs:
        - source: PDF/a.pdf
        - source: PDF/b.pdf
