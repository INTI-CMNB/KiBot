# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/INTI-CMNB/KiBot@master/docs/kibot_schema.json
# Example KiBot config file
kibot:
  version: 1

preflight:
  annotate_pcb:
    top_main_axis: y
    top_main_ascending: true
    top_secondary_ascending: false
    bottom_main_axis: y
    bottom_main_ascending: true
    bottom_secondary_ascending: false
    bottom_start: -1
    use_position_of: footprint
    grid: 0.1

outputs:
  - name: PDF_F
    comment: "PDF files"
    type: pdf
    layers:
      - layer: F.SilkS
        suffix: F_Silks

  - name: PDF_B
    comment: "PDF files"
    type: pdf
    options:
      mirror_plot: true
    layers:
      - layer: B.SilkS
        suffix: B_Silks

  - name: 'bom_internal'
    comment: "Bill of Materials in CSV format"
    type: bom
    options:
      csv:
        hide_pcb_info: true
        hide_stats_info: true
      columns: [References, Value]
