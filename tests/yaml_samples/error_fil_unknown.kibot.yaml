# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/INTI-CMNB/KiBot@master/docs/kibot_schema.json
# Example KiBot config file
kibot:
  version: 1

outputs:
  - name: 'empty_val'
    comment: "BoM no empty val"
    type: bom
    dir: BoM
    options:
      output: 'empty_val.csv'
      use_alt: true
      exclude_filter: 'empty val'

