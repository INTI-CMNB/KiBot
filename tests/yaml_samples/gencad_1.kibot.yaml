# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/INTI-CMNB/KiBot@master/docs/kibot_schema.json
# Example KiBot config file
kibot:
  version: 1

outputs:
  - name: 'GENCAD export Test'
    comment: "Example of GENCAD export"
    type: gencad
    options:
      flip_bottom_padstacks: true
      no_reuse_shapes: true
      save_origin: true
