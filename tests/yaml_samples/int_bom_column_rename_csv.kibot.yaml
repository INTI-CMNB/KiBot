# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/INTI-CMNB/KiBot@master/docs/kibot_schema.json
# Example KiBot config file
kibot:
  version: 1

outputs:
  - name: 'bom_internal'
    comment: "Bill of Materials in CSV format"
    type: bom
    dir: BoM
    options:
      count_smd_tht: true
      columns:
        - field: Row
          name: Renglón
        - field: References
          name: Referencias
        - field: Part
          name: Componente
        - field: Value
          name: Valor
        - field: digikey#
          name: Código Digi-Key
        - field: Quantity Per PCB
          name: Cantidad por PCB
