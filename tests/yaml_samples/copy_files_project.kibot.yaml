# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/INTI-CMNB/KiBot@master/docs/kibot_schema.json
# Example KiBot config file
kibot:
  version: 1

outputs:
  - name: result
    comment: 'Copy files from source, output and 3D models'
    type: copy_files
    options:
      files:
        - source_type: project
          dest: prj
