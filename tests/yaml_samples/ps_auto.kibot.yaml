# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/INTI-CMNB/KiBot@master/docs/kibot_schema.json
kiplot:
  version: 1

outputs:
  - name: postscript
    comment: "Postscript files"
    type: ps
    dir: PS
    options:
      exclude_edge_layer: false
      exclude_pads_from_silkscreen: false
      use_aux_axis_as_origin: false
      plot_sheet_reference: false
      plot_footprint_refs: true
      plot_footprint_values: true
      force_plot_invisible_refs_vals: false
      tent_vias: true

      # PS options
      line_width: 0.15
      drill_marks: full
      scaling: 0
      sketch_plot: false
      scale_adjust_x: 1.0
      scale_adjust_y: 1.0
      width_adjust: 0
      mirror_plot: false
      negative_plot: false
      a4_output: true
    layers:
      - layer: F.Cu
        suffix: F_Cu
      - layer: F.Fab
        suffix: F_Fab
